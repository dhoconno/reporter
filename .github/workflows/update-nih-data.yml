name: Update NIH Reporter Data
on:
  schedule:
    - cron: '0 12 * * *' # Run at noon every day
  workflow_dispatch:    # Allow manual triggers

permissions:
  contents: write
  pages: write      # Required for GitHub Pages deployment
  id-token: write   # Required for GitHub Pages deployment

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 11 # needed for tabula-py
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: |
          mkdir -p cache/reporter cache/federal_register cache/taggs
          mkdir -p pages/reports pages/assets/images pages/assets/csv
          mkdir -p data/processed/reporter data/processed/federal_register data/processed/taggs
          mkdir -p data/external

      - name: Migrate uncompressed cache files
        run: |
          python -c "
          import os
          import json
          import zstandard as zstd
          from pathlib import Path
          
          cache_dir = Path('cache/reporter')
          if cache_dir.exists():
              for json_file in cache_dir.glob('*.json'):
                  if not json_file.name.endswith('.json.zst'):
                      print(f'Compressing {json_file}...')
                      try:
                          with open(json_file, 'r') as f:
                              data = json.load(f)
                          
                          json_str = json.dumps(data)
                          json_bytes = json_str.encode('utf-8')
                          
                          compressor = zstd.ZstdCompressor(level=3)
                          compressed_data = compressor.compress(json_bytes)
                          
                          compressed_file = json_file.with_suffix('.json.zst')
                          with open(compressed_file, 'wb') as f:
                              f.write(compressed_data)
                          
                          # Remove the original uncompressed file
                          json_file.unlink()
                          print(f'Migrated {json_file} to {compressed_file}')
                      except Exception as e:
                          print(f'Error migrating {json_file}: {e}')
          "

      - name: Run reporter update
        run: |
          python utils/data-processors/find_reporter_cumulative_grants.py --force-refresh

      - name: Commit reporter data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # Stash any unstaged changes, pull latest, then pop stash
          git stash push -m "temp stash before pull" || true
          git pull origin main --rebase
          git stash pop || true

          # Force add cache files (they may be in .gitignore)
          git add -f cache/reporter/*.json.zst || true
          
          # Add main reports and assets
          git add pages/reports/nih_awards.html pages/assets/nih_awards.png
          git add pages/reports/nih_award_amounts.html pages/assets/nih_award_amounts.png
          git add data/processed/reporter/nih_awards_all.csv.zst
          
          # Add all IC-specific reports that were generated
          git add pages/reports/nih_awards_*.html || true
          git add pages/reports/nih_award_amounts_*.html || true
          git add pages/assets/nih_awards_*.png || true
          git add pages/assets/nih_award_amounts_*.png || true

          git diff --staged --quiet || git commit -m "Update NIH Reporter data"
          git push origin main

      - name: Run federal register update
        run: |
          python utils/data-processors/find_federal_register_announcements.py

      - name: Commit federal register data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # Stash any unstaged changes, pull latest, then pop stash
          git stash push -m "temp stash before pull" || true
          git pull origin main --rebase
          git stash pop || true

          # Force add cache files (they may be in .gitignore)
          git add -f cache/federal_register/**/* || true
          
          # Add main reports and assets
          git add pages/reports/nih_fr_meetings.html pages/assets/nih_fr_meetings.png
          git add data/processed/federal_register/nih_fr_meetings_all.csv.zst
          
          # Add all IC-specific Federal Register reports that were generated
          git add pages/reports/nih_fr_meetings_*.html || true
          git add pages/assets/nih_fr_meetings_*.png || true

          git diff --staged --quiet || git commit -m "Update Federal Register data"
          git push origin main

      - name: Run terminated grants update
        run: |
          python utils/data-processors/find_taggs_terminated_grants.py

      - name: Commit terminated grants data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # Stash any unstaged changes, pull latest, then pop stash
          git stash push -m "temp stash before pull" || true
          git pull origin main --rebase
          git stash pop || true

          # Force add cache files (they may be in .gitignore)
          git add -f cache/taggs/*.json || true
          git add -f data/processed/taggs/hhs_grants_terminated.csv || true
          git add -f pages/assets/csv/hhs_grants_terminated.csv || true

          git diff --staged --quiet || git commit -m "Update terminated grants data"
          git push origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'

      - name: Upload NIH Reporter data to LabKey
        run: python utils/data-processors/extract_reporter_to_labkey.py
        env:
          LABKEY_API_KEY: ${{ secrets.LABKEY_API_KEY }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4