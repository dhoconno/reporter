name: Update NIH Reporter Data
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run at midnight every day
  workflow_dispatch: # Allow manual triggers
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests plotly numpy kaleido bs4 pandas zstandard tabula-py
      - name: Run update script
        run: |
          python utils/data-processors/cumulative_grants_by_award_date.py --force-refresh
      - name: Run federal register script
        run: |
          python utils/data-processors/cumulative_fr_announcements.py
      - name: Run terminated grants script
        run: |
          python utils/data-processors/extract_terminated_grants.py
      - name: Commit and push if changes exist
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Add cache directories for all scripts
          git add cache/grants/*.json
          git add cache/federal-register/**/*
          git add cache/taggs/terminated_cache/*.json
          
          # Add output files from cumulate_grants scripts
          git add pages/reports/nih_awards.html
          git add pages/assets/images/nih_awards.png
          git add pages/reports/nih_award_amounts.html
          git add pages/assets/images/nih_award_amounts.png
          git add results/grants/nih_awards_all.csv.zst
          
          # Add output files from federal register scripts
          git add pages/reports/nih_fr_meetings.html
          git add pages/assets/images/nih_fr_meetings.png
          git add results/federal-register/nih_fr_meetings_all.csv.zst
          
          # Add output files from terminated grants scripts
          git add pages/reports/terminated_grants.html
          git add results/taggs/HHS_Grants_Terminated.csv
          git add results/taggs/NIH_Grants_Terminated.csv
          
          # Commit if there are changes
          git diff --staged --quiet || git commit -m "Update NIH data"
          git push