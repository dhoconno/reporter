name: Update NIH Reporter Data
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * *' # Run at midnight every day
  workflow_dispatch: # Allow manual triggers
permissions:
  contents: write
  pages: write      # Required for GitHub Pages deployment
  id-token: write   # Required for GitHub Pages deployment
jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4  # latest version
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5  # latest version
        with:
          python-version: '3.10'
      - name: Set up JDK 11 # needed for tabula-py
        uses: actions/setup-java@v4  # latest version
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests plotly numpy kaleido bs4 pandas zstandard tabula-py
      - name: Create output directories
        run: |
          mkdir -p cache/reporter
          mkdir -p cache/federal_register
          mkdir -p cache/taggs
          mkdir -p pages/reports
          mkdir -p pages/assets/images
          mkdir -p pages/assets/csv
          mkdir -p data/processed/reporter
          mkdir -p data/processed/federal_register
          mkdir -p data/processed/taggs
          mkdir -p data/external
      - name: Run update script
        run: |
          python utils/data-processors/find_reporter_cumulative_grants.py --force-refresh
      - name: Run federal register script
        run: |
          python utils/data-processors/find_federal_register_announcements.py
      - name: Run terminated grants script
        run: |
          python utils/data-processors/find_taggs_terminated_grants.py
      - name: Commit and push if changes exist
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Add cache directories for all scripts
          git add cache/reporter/*.json
          git add cache/federal_register/**/*
          git add cache/taggs/*.json
          
          # Add output files from cumulate_grants scripts
          git add pages/reports/nih_awards.html
          git add pages/assets/images/nih_awards.png
          git add pages/reports/nih_award_amounts.html
          git add pages/assets/images/nih_award_amounts.png
          git add data/processed/reporter/nih_awards_all.csv.zst
          
          # Add output files from federal register scripts
          git add pages/reports/nih_fr_meetings.html
          git add pages/assets/images/nih_fr_meetings.png
          git add data/processed/federal_register/nih_fr_meetings_all.csv.zst
          
          # Add output files from terminated grants scripts
          git add pages/reports/terminated_grants.html
          git add pages/assets/csv/hhs_grants_terminated.csv
          
          # Commit if there are changes
          git diff --staged --quiet || git commit -m "Update NIH data"
          git push
          
      # GitHub Pages deployment steps (added directly to the update-data job)
      - name: Setup Pages
        uses: actions/configure-pages@v5  # specifying latest version
        
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3  # updated to latest version to avoid deprecation issues
        with:
          path: 'pages'  # Specify the directory containing your site's content
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # specifying latest version