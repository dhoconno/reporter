name: Update NIH Reporter Data
on:
  schedule:
    - cron: '0 0 * * *' # Run at midnight every day
  workflow_dispatch: # Allow manual triggers
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests plotly numpy kaleido bs4 pandas zstandard
      - name: Run update script
        run: |
          python cumulative_grants_by_award_date.py --force-refresh
      - name: Run federal register script
        run: |
          python cumulative_fr_announcements.py
      - name: Commit and push if changes exist
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Add cache directories for both scripts
          git add cache/*.json
          git add fr_cache/**/*
          # Add output files from the first script
          git add nih_awards.html
          git add nih_awards.png
          git add nih_award_amounts.html
          git add nih_award_amounts.png
          git add nih_awards_all.csv.zst
          # Add output files from the second script
          git add nih_fr_meetings.html
          git add nih_fr_meetings.png
          git add nih_fr_meetings_all.csv.zst
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NIH Reporter data $(date +'%Y-%m-%d')" && git push)