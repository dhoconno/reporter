<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Terminated Grants Explorer (TAGGS)</title>
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <!-- DataTables Extensions CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/searchpanes/2.2.0/css/searchPanes.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/select/1.7.0/css/select.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/scroller/2.2.0/css/scroller.dataTables.min.css">
  <!-- FixedHeader CSS (Optional but recommended with scrollX/scrollY) -->
  <link rel="stylesheet" href="https://cdn.datatables.net/fixedheader/3.4.0/css/fixedHeader.dataTables.min.css">


  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 15px;
      /* Removed max-width to allow table to expand */
      margin: 10px auto;
      font-size: 0.9rem;
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      margin-top: 15px;
      width: 100%; /* Ensure container takes full width */
      overflow-x: auto; /* Let the container handle outer scroll if needed, though DT scrollX should handle table scroll */
    }
    .loading {
      text-align: center;
      margin: 60px 0;
      font-size: 20px;
      color: #555;
    }
    #grants-table {
      width: 100%; /* Let DataTables manage width with scrollX */
    }
    /* Style SearchPanes container, buttons, filter input */
    .dtsp-searchPanes, .dt-buttons, .dataTables_filter {
        margin-bottom: 15px;
    }
    .dt-buttons .dt-button {
        margin-right: 5px;
    }
    .dataTables_info {
        margin-top: 10px;
        padding-top: 10px;
    }
    .dataTables_filter input {
        width: 280px;
        margin-left: 0.5em;
    }
     /* --- REMOVED position: sticky for thead th ---
        DataTables scrollX/scrollY handles header synchronization.
        FixedHeader extension can be used for keeping header visible on *page* scroll.
     -------------------------------------------------*/

     /* Optional: Style the fixed header if using FixedHeader extension */
     table.dataTable thead th {
         background-color: #f8f8f8; /* Keep background */
         border-bottom: 2px solid #ddd;
     }

    /* Style SearchPanes */
    .dtsp-searchPanes {
        border: 1px solid #ccc;
        padding: 10px;
        background-color: #fdfdfd;
        border-radius: 4px;
        margin-bottom: 15px; /* Ensure space below panes */
    }
    /* Truncated text hover effect */
    .truncated-text {
        cursor: default;
    }

    /* Ensure DataTables scroll wrapper behaves */
    .dataTables_wrapper {
        width: 100%;
    }

  </style>
</head>
<body>
  <h1>Terminated Grants Explorer (TAGGS Data)</h1>
  <div class="container">
    <div id="loading" class="loading">Loading grant data... Please wait.</div>
    <table id="grants-table" class="display compact nowrap" style="width:100%; display:none;">
      <thead>
        <!-- Headers populated dynamically -->
      </thead>
      <tbody>
        <!-- Data populated dynamically -->
      </tbody>
    </table>
  </div>

  <!-- JavaScript libraries -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <!-- DataTables Extensions JS -->
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
  <script src="https://cdn.datatables.net/searchpanes/2.2.0/js/dataTables.searchPanes.min.js"></script>
  <script src="https://cdn.datatables.net/select/1.7.0/js/dataTables.select.min.js"></script>
  <script src="https://cdn.datatables.net/scroller/2.2.0/js/dataTables.scroller.min.js"></script>
  <!-- FixedHeader JS (Optional but recommended with scrollX/scrollY) -->
   <script src="https://cdn.datatables.net/fixedheader/3.4.0/js/dataTables.fixedHeader.min.js"></script>
  <!-- PapaParse for CSV Handling -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    $(document).ready(function() {
      // --- Configuration ---
      const csvFilePath = '../assets/csv/hhs_grants_terminated.csv';
      const defaultSortColumn = 'Action Date (Date Terminated)';
      const currencyColumns = [
          'Total Amount Obligated',
          'Total Amount Expended',
          'Unliquidated Obligations (As of Termination)'
      ];
      const longTextColumns = {
          'Project_Terms': 150,
          'Award Title': 100,
          'Recipient Name': 50
      };
      const excludeFromSearchPanes = [
          'FAIN',
          'Award Number',
          'Project_Terms',
          'PI_Names'
      ];
      // --- End Configuration ---

      Papa.parse(csvFilePath, {
        download: true,
        header: true,
        skipEmptyLines: 'greedy',
        dynamicTyping: true,
        complete: function(results) {
          if (results.errors.length > 0) {
            console.error("CSV Parsing Errors:", results.errors);
            $('#loading').html(`Error parsing CSV file. Check console for details.`);
            return;
          }
           if (!results.data || results.data.length === 0) {
             $('#loading').html(`No data found in the CSV file.`);
             return;
          }

          $('#loading').hide();

          const headers = results.meta.fields;
          const data = results.data;

          // --- Prepare Table Headers ---
          let headerRow = '<tr>';
          headers.forEach(header => {
            headerRow += `<th>${header.replace(/_/g, ' ')}</th>`;
          });
          headerRow += '</tr>';
          $('#grants-table thead').html(headerRow);

          // --- Find Column Indices ---
          const defaultSortColumnIndex = headers.indexOf(defaultSortColumn);
          const currencyColumnIndices = currencyColumns.map(colName => headers.indexOf(colName)).filter(index => index !== -1);
          const longTextColumnIndices = {};
            for (const colName in longTextColumns) {
                const index = headers.indexOf(colName);
                if (index !== -1) { longTextColumnIndices[index] = longTextColumns[colName]; }
            }
           const searchPaneExcludeIndices = excludeFromSearchPanes.map(colName => headers.indexOf(colName)).filter(index => index !== -1);

          // --- Prepare Column Definitions ---
          const columnDefs = [
             { searchPanes: { show: false }, targets: searchPaneExcludeIndices },
             // { orderable: false, targets: headers.indexOf('Project_Terms') } // Optional: disable ordering
          ];

           // Add renderers for currency
          currencyColumnIndices.forEach(index => {
            columnDefs.push({
                targets: index,
                render: function(data, type, row) { /* ... (currency rendering unchanged) ... */
                   if (type === 'display' || type === 'export') {
                         if (data === null || data === undefined || data === '' || isNaN(Number(data))) {
                            return '';
                        }
                        return '$' + Number(data).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    }
                     return (data === null || data === undefined || data === '') ? -Infinity : Number(data);
                },
                type: 'num-fmt'
            });
          });

           // Add renderers for long text
           for (const index in longTextColumnIndices) {
                const maxLength = longTextColumnIndices[index];
                columnDefs.push({
                    targets: parseInt(index, 10),
                    render: function(data, type, row) { /* ... (truncation rendering unchanged) ... */
                        const text = String(data || '');
                        if (type === 'display') {
                            if (text.length > maxLength) {
                                const escapedText = text.replace(/"/g, '"');
                                return `<span class="truncated-text" title="${escapedText}">${text.substr(0, maxLength)}...</span>`;
                            }
                            return text;
                        }
                        return text;
                    }
                });
            }

          $('#grants-table').show();

          // --- Initialize DataTable ---
          const table = $('#grants-table').DataTable({
            // --- Data ---
            data: data,
            columns: headers.map(header => ({ data: header, title: header.replace(/_/g, ' ') })),

            // --- Core Features & Layout ---
            dom: 'PBfrti',
            deferRender: true,

            // --- Scrolling ---
            scrollX: true,        // *** ENABLE HORIZONTAL SCROLLING ***
            scrollY: '60vh',
            scrollCollapse: true,
            scroller: true,       // Enable Scroller extension for vertical virtual scroll

            // --- Extensions ---
             buttons: [
                { extend: 'copyHtml5', text: 'Copy' },
                { extend: 'csvHtml5', text: 'CSV' },
                { extend: 'excelHtml5', text: 'Excel' }
            ],
            searchPanes: {
              layout: 'columns-auto',
              initCollapsed: false,
              cascadePanes: true,
              viewTotal: true,
            },
            fixedHeader: true, // Optional: Use FixedHeader to keep header visible on PAGE scroll, works well with scrollX/scrollY

            // --- Sorting & Column Defs ---
            order: defaultSortColumnIndex !== -1 ? [[defaultSortColumnIndex, 'desc']] : [],
            columnDefs: columnDefs,

            // --- Minor Config ---
            // stateSave: true, // Optional: Remember state
          });

        }, // End complete callback
        error: function(error, file) {
          $('#loading').html(`Error loading or parsing CSV file: ${error}`);
          console.error('PapaParse Error:', error, file);
        }
      }); // End Papa.parse
    }); // End document ready
  </script>

</body>
</html>
